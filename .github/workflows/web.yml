# Web: tests on every push/PR; build and publish images to GHCR on push to master.
# Updating the VPS is manual: docker compose pull && docker compose up -d (see web/README.md).
name: web

on:
  push:
    branches: [master, dev]
    paths: ["web/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", ".github/workflows/web.yml"]

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository }}-api
  IMAGE_FRONTEND: ghcr.io/${{ github.repository }}-frontend

jobs:
  test-server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: battleship_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: web/server
    env:
      BS_DATABASE_URL: postgresql+asyncpg://postgres@localhost:5432/battleship_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: web/server/requirements.txt
      - run: pip install -r requirements.txt pytest pytest-asyncio httpx "numpy<2"
      - run: alembic upgrade head
      - run: pytest -q

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc -b
      - run: npm test

  build-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [test-server, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: api
        uses: docker/build-push-action@v6
        with:
          context: web/server
          push: true
          tags: |
            ${{ env.IMAGE_API }}:latest
            ${{ env.IMAGE_API }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: frontend
        uses: docker/build-push-action@v6
        with:
          context: web/frontend
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
