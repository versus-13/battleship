# Production on a VPS: prebuilt images from GHCR (built by GitHub Actions on push to master).
# Put it at /opt/battleship/docker-compose.yml next to .env (POSTGRES_PASSWORD).
# Update: docker compose pull && docker compose up -d
# Ports are bound to localhost only; the reverse proxy with TLS is external (see web/README.md).
#
# api and frontend run as an unprivileged UID with no account on the host (APP_UID/APP_GID
# in .env, default 10001). Do not use the deploy user's UID: that user is in the docker
# group, i.e. root-equivalent, so an escape would land exactly where we don't want it.
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp"]

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # the entrypoint starts as root only to chown the data dir, then drops to postgres (uid 70)
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_DB: battleship
      POSTGRES_USER: battleship
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U battleship"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: ghcr.io/versus-13/battleship-api:${TAG:-latest}
    restart: unless-stopped
    <<: *hardening
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    environment:
      BS_DATABASE_URL: postgresql+asyncpg://battleship:${POSTGRES_PASSWORD}@db:5432/battleship
      BS_CORS_ORIGINS: '[]'
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ghcr.io/versus-13/battleship-frontend:${TAG:-latest}
    restart: unless-stopped
    <<: *hardening
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  pgdata:
