# nginx inside the frontend container: static files only. SSL and /api, /ws are on the external reverse proxy.
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;

    # hashed Vite bundles and the ORT wasm — cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # the model changes rarely; the version is checked via /api/model
    location /model/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # SPA: any path (/play, /room/CODE, /match/ID) serves index.html
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
